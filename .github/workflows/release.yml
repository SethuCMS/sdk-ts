name: Release

# Push a tag such as v0.1.0 to build, test and attach the packed TypeScript SDK to a GitHub release.
# Publishing to npm is left off until the packages no longer link to sibling folders.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: sethucms-sdk-ts
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --no-frozen-lockfile
        working-directory: sethucms-sdk-ts
      - run: pnpm build
        working-directory: sethucms-sdk-ts
      - run: pnpm test
        working-directory: sethucms-sdk-ts
      - name: Pack
        run: mkdir out && pnpm pack --pack-destination out
        working-directory: sethucms-sdk-ts
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: sethucms-sdk-ts/out/*.tgz
